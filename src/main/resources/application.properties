# ---------------------------------------------------------------------------
# The demonstration application.
#
# This is a single-user demo bound to localhost: there is no authentication, no
# persistence and no TLS. It must not be exposed beyond the local machine.
# ---------------------------------------------------------------------------

# Bind to loopback only. The API lets a caller approve a remediation, so it must
# not be reachable from the network.
server.address=127.0.0.1
server.port=8080

spring.application.name=ai-security-guard

# Which decision policy the agent uses. "reference" is deterministic and works
# offline, which is the default so the app always starts. Set to "llm" (or start
# with -Daisecurityguard.agent.policy=llm) to use the live language model.
aisecurityguard.agent.policy=reference

# The UI is a static page; nothing else needs a web layer.
spring.web.resources.static-locations=classpath:/static/

# Quieter startup: this is a demo, not a service.
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.springframework.boot.web.embedded=WARN
